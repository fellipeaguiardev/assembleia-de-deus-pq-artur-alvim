# Alerta de lentidão: a cada 30 min, uma visita de teste ao site no ar
# (tests/carga/sonda.js). Se algo der erro ou demorar mais de 2,5 s, abre um
# aviso (issue) "Site lento ou fora do ar" — o GitHub manda e-mail para o dono
# do repositório. Quando volta ao normal, comenta e fecha o aviso sozinho.
# Também dá para rodar à mão: Actions → "Alerta de lentidão" → Run workflow.
name: Alerta de lentidão

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Visita de teste
        id: sonda
        continue-on-error: true
        run: k6 run --quiet tests/carga/sonda.js
      - name: Abrir, atualizar ou fechar o aviso
        uses: actions/github-script@v7
        env:
          FALHOU: ${{ steps.sonda.outcome == 'failure' }}
        with:
          script: |
            const fs = require("fs");
            const resumo = fs.existsSync("sonda-resumo.md") ? fs.readFileSync("sonda-resumo.md", "utf8") : "A visita de teste não terminou (veja o log da execução).";
            const titulo = "⚠️ Site lento ou fora do ar";
            const execucao = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: abertos } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "alerta-lentidao" });
            const aberto = abertos[0];
            if (process.env.FALHOU === "true") {
              const corpo = `${resumo}\n\n[Ver a execução](${execucao})`;
              if (aberto) await github.rest.issues.createComment({ ...context.repo, issue_number: aberto.number, body: `Continua com problema:\n\n${corpo}` });
              else await github.rest.issues.create({ ...context.repo, title: titulo, labels: ["alerta-lentidao"], body: `A visita de teste ao site ficou lenta ou deu erro.\n\n${corpo}\n\nEste aviso fecha sozinho quando o site voltar ao normal.` });
              core.setFailed("Site lento ou com erro.");
            } else if (aberto) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: aberto.number, body: `Voltou ao normal.\n\n${resumo}` });
              await github.rest.issues.update({ ...context.repo, issue_number: aberto.number, state: "closed" });
            }
